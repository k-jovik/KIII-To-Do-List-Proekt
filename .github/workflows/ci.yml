
name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Билдање и пуштање на Backend имиџот
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend  # Патеката каде му е Dockerfile-от за backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-backend:latest

      # 2. Билдање и пуштање на Frontend имиџот
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend   # Патеката каде му е Dockerfile-от за frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest